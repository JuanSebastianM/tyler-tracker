name: CI
# Every push and PR: typecheck, unit tests, i18n parity, content schemas, e2e smoke tests.
# On main, when the checks pass: assemble _site, stamp the service worker, deploy to GitHub Pages.
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install tools (exact versions from package.json devDependencies)
        run: npm install --no-audit --no-fund --no-package-lock
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: npm run check
        run: npm run check
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Assemble site and stamp service worker
        run: node scripts/build-site.mjs _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Smoke test the live site
        env:
          URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          short="${GITHUB_SHA:0:7}"
          for i in $(seq 1 12); do
            if curl -fsS "${URL}sw.js" | grep -q "\"${short}-"; then break; fi
            echo "waiting for the new deploy ($i)"; sleep 10
          done
          curl -fsS "${URL}sw.js" | grep -q "\"${short}-" || { echo "::error::sw.js on Pages is not stamped with ${short}"; exit 1; }
          curl -fsS "${URL}src/version.js" | grep -q "\"${short}-" || { echo "::error::src/version.js on Pages is not stamped with ${short}"; exit 1; }
          curl -fsS "$URL" | grep -q 'src/main.js'
          for f in manifest.webmanifest vendor/preact.js vendor/supabase.js src/main.js src/i18n/es.json content/faq.json assets/icons/icon-192.png; do
            curl -fsS -o /dev/null "${URL}${f}" || { echo "::error::missing ${f}"; exit 1; }
          done
          echo "Live site OK: $URL ($short)"
