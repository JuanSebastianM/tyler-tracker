name: vendor
# Installs the libraries pinned in vendor/versions.json, bundles them into single ESM files with
# esbuild and commits the result to main. The app never loads code from a CDN.
on:
  push:
    branches: [main]
    paths: [vendor/versions.json]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: vendor
  cancel-in-progress: false
jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned packages
        run: |
          mkdir -p vendor-build-tmp
          cd vendor-build-tmp
          npm init -y > /dev/null
          specs=$(node -e "const v=require('../vendor/versions.json').packages;console.log(Object.entries(v).map(([n,r])=>n+'@'+r).join(' '))")
          echo "Installing: $specs esbuild@0.28.2"
          npm install --no-audit --no-fund --save-exact $specs esbuild@0.28.2
      - name: Bundle
        run: node scripts/vendor-build.mjs vendor-build-tmp
      - name: Smoke test bundles
        run: |
          node --input-type=module -e "
            const p = await import('./vendor/preact.js');
            for (const k of ['h','render','Fragment','createContext','useState','useEffect','useMemo','useRef','useCallback','useContext','html']) if (!p[k]) throw new Error('preact missing ' + k);
            const s = await import('./vendor/supabase.js');
            if (typeof s.createClient !== 'function') throw new Error('supabase missing createClient');
            console.log('vendor bundles OK');"
          ls -la vendor
      - name: Commit
        run: |
          rm -rf vendor-build-tmp
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vendor
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Vendor runtime libraries ($(node -e "const v=require('./vendor/versions.json').packages;console.log(Object.entries(v).map(([n,r])=>n+'@'+r).join(', '))"))"
          git pull --rebase origin main
          git push origin HEAD:main
